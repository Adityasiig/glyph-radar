plugins { id 'com.android.application' }

android {
    namespace 'com.adityasingh.glyph'
    compileSdk 34

    defaultConfig {
        applicationId "com.adityasingh.glyph"
        // The Glyph SDK needs Android 14 or newer.
        minSdk 34
        targetSdk 34
        versionCode 4
        versionName "2.0"
    }

    signingConfigs {
        release {
            // Checked in on purpose. This is a hobby toy with no Play
            // listing, so the key guards nothing; a reproducible build
            // matters more than a secret.
            storeFile file('../glyph-radar-release.jks')
            storePassword 'glyphradar'
            keyAlias 'glyphradar'
            keyPassword 'glyphradar'
        }
    }

    buildTypes {
        release {
            // Keep the Glyph SDK's classes intact; it is reflective in
            // places and there is nothing here worth shrinking.
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy {
        // The SDK pulls kotlin-stdlib-jdk7/jdk8 1.6.21, whose classes
        // were folded into kotlin-stdlib 1.8+. Force one version so
        // they do not collide at dex time.
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    // Drop Nothing's KetchumSDK_Community_20250109.jar into app/libs/.
    // It is not published to Maven, so it has to be vendored by hand.
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
